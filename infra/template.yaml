AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Resume Screener Pipeline - P2 infrastructure (SAM)

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment stage; stack names are rs-dev and rs-prod.
  ParserVersion:
    Type: String
    Default: stub-0.1.0
  ScorerVersion:
    Type: String
    Default: stub-0.1.0
  SesSender:
    Type: String
    Default: DISABLED
    Description: Verified SES sender identity; set before enabling shortlist email.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional email subscription for operational alarms and budget alerts.
  MonthlyBudgetUsd:
    Type: Number
    Default: 25
    MinValue: 1

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    Runtime: python3.12
    Handler: app.lambda_handler
    Architectures: [x86_64]
    MemorySize: 256
    Environment:
      Variables:
        STAGE: !Ref Stage
        LOG_LEVEL: INFO
    Tags:
      Project: resume-screener
      Stage: !Ref Stage

Resources:
  UploadsBucket:
    Type: AWS::S3::Bucket
    DependsOn: UploadQueuePolicy
    Properties:
      BucketName: !Sub rs-${Stage}-uploads-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireResumeAndParsedArtifacts
            Status: Enabled
            Prefix: resumes/
            ExpirationInDays: 30
          - Id: ExpireParsedArtifacts
            Status: Enabled
            Prefix: parsed/
            ExpirationInDays: 30
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt JdQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: jd/
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ParseQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: resumes/
      Tags:
        - Key: Project
          Value: resume-screener
        - Key: Stage
          Value: !Ref Stage

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub rs-${Stage}-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: resume-screener
        - Key: Stage
          Value: !Ref Stage

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub rs-${Stage}-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: resume-screener
        - Key: Stage
          Value: !Ref Stage

  CandidatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub rs-${Stage}-candidates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: candidate_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
        - AttributeName: candidate_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: resume-screener
        - Key: Stage
          Value: !Ref Stage

  FailedJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub rs-${Stage}-failed-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: failed_id
          AttributeType: S
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: failed_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: job_id-created_at
          KeySchema:
            - AttributeName: job_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: resume-screener
        - Key: Stage
          Value: !Ref Stage

  ParseDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub rs-${Stage}-parse-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: resume-screener
        - Key: Stage
          Value: !Ref Stage

  JdDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub rs-${Stage}-jd-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: resume-screener
        - Key: Stage
          Value: !Ref Stage

  ScoreDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub rs-${Stage}-score-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: resume-screener
        - Key: Stage
          Value: !Ref Stage

  ParseQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub rs-${Stage}-parse-queue
      VisibilityTimeout: 900
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ParseDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: resume-screener
        - Key: Stage
          Value: !Ref Stage

  JdQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub rs-${Stage}-jd-queue
      VisibilityTimeout: 900
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JdDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: resume-screener
        - Key: Stage
          Value: !Ref Stage

  ScoreQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub rs-${Stage}-score-queue
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScoreDlq.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Project
          Value: resume-screener
        - Key: Stage
          Value: !Ref Stage

  UploadQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref JdQueue
        - !Ref ParseQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowUploadsBucketNotifications
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - !GetAtt JdQueue.Arn
              - !GetAtt ParseQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:s3:::rs-${Stage}-uploads-${AWS::AccountId}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

Outputs:
  UploadsBucketName:
    Description: Private bucket for JD and resume uploads.
    Value: !Ref UploadsBucket
  FrontendBucketName:
    Description: Private bucket for the static frontend.
    Value: !Ref FrontendBucket
  JobsTableName:
    Value: !Ref JobsTable
  CandidatesTableName:
    Value: !Ref CandidatesTable
  FailedJobsTableName:
    Value: !Ref FailedJobsTable
