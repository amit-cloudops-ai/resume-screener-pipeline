Outputs:
  UploadsBucketName:
    Description: Private bucket for JD and resume uploads.
    Value: !Ref UploadsBucket
  FrontendBucketName:
    Description: Private bucket for the static frontend.
    Value: !Ref FrontendBucket
  CloudFrontUrl:
    Description: HTTPS URL for the recruiter dashboard.
    Value: !Sub https://${FrontendDistribution.DomainName}
  JobsTableName:
    Value: !Ref JobsTable
  CandidatesTableName:
    Value: !Ref CandidatesTable
  FailedJobsTableName:
    Value: !Ref FailedJobsTable
  ApiUrl:
    Description: API Gateway v1 base URL.
    Value: !Sub https://${ResumeApi}.execute-api.${AWS::Region}.amazonaws.com/v1/
  UserPoolId:
    Value: !Ref RecruiterUserPool
  UserPoolClientId:
    Value: !Ref RecruiterUserPoolClient
  ParseQueueUrl:
    Value: !Ref ParseQueue
  JdQueueUrl:
    Value: !Ref JdQueue
  ScoreQueueUrl:
    Value: !Ref ScoreQueue
  CloudFrontDomainName:
    Value: !GetAtt FrontendDistribution.DomainName
