  CustomRecognizerParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rs/${Stage}/custom-recognizer-arn
      Type: String
      Value: !Ref CustomRecognizerArn
      Description: Mirrors the CustomRecognizerArn stack parameter; redeploy with an ARN to enable custom entities.

  ThresholdDefaultParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rs/${Stage}/threshold-default
      Type: String
      Value: '60'
      Description: Default candidate score threshold.

  OpsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub rs-${Stage}-ops-alerts
      DisplayName: Resume Screener operational alerts
      Tags:
        - Key: Project
          Value: resume-screener
        - Key: Stage
          Value: !Ref Stage

  OpsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref OpsTopic

  ParseDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub rs-${Stage}-parse-dlq-depth
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt ParseDlq.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  JdDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub rs-${Stage}-jd-dlq-depth
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt JdDlq.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
