<rect class="n rose" x="1045" y="435" width="180" height="56" rx="8"/><text class="l" x="1135" y="460" text-anchor="middle">Per-stage DLQs</text><text class="sm" x="1135" y="478" text-anchor="middle">parse · JD · score</text><rect class="n rose" x="1250" y="435" width="190" height="56" rx="8"/><text class="l" x="1345" y="460" text-anchor="middle">DLQ consumer</text><text class="sm" x="1345" y="478" text-anchor="middle">persist failed_jobs</text>
<rect class="n" x="1045" y="530" width="180" height="56" rx="8"/><text class="l" x="1135" y="555" text-anchor="middle">CloudWatch</text><text class="sm" x="1135" y="573" text-anchor="middle">logs · metrics · alarms</text><rect class="n" x="1250" y="530" width="190" height="56" rx="8"/><text class="l" x="1345" y="555" text-anchor="middle">SNS notifications</text><text class="sm" x="1345" y="573" text-anchor="middle">DLQ / Lambda / API</text><rect class="n amber" x="1045" y="625" width="395" height="45" rx="8"/><text class="l" x="1242" y="653" text-anchor="middle">AWS Budget alert · USD 25 default threshold</text><path class="e" d="M1225 463 H1250"/><path class="e" d="M1225 558 H1250"/><path class="e" d="M1242 625 V586"/>
<rect x="40" y="750" width="1420" height="190" rx="14" fill="#eeeee7" stroke="#d9ded3"/><text class="h" x="65" y="790">Trust boundaries and operating rules</text><text class="l" x="65" y="830">Identity</text><text class="sm" x="65" y="852">Recruiter-only Cognito SRP; raw ID token in Authorization header; every API route protected.</text><text class="l" x="65" y="890">Data</text><text class="sm" x="65" y="912">Private S3 buckets, SSE-S3, DynamoDB encryption, least-privilege Lambda roles, 30-day resume/parsed lifecycle.</text><text class="l" x="780" y="830">Resilience</text><text class="sm" x="780" y="852">SQS retries + per-stage DLQs; idempotent candidate IDs; permanent vs transient failure policy.</text><text class="l" x="780" y="890">Cost guardrails</text><text class="sm" x="780" y="912">Custom Comprehend endpoint disabled by default; budget alerts notify but do not cap spend.</text>
