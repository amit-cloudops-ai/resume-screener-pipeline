<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
<title id="title">Resume Screening Pipeline architecture</title><desc id="desc">Recruiter browser, Cognito authentication, CloudFront frontend, Cognito-protected API, asynchronous S3 and SQS processing, Textract, Comprehend, DynamoDB, SES and DLQ operations.</desc>
